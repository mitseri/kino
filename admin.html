<style>
:root{--tx:#1b1a18;--mut:#7a7165;--line:rgba(255,255,255,.65);--glass:rgba(255,255,255,.38);--glass2:rgba(255,255,255,.6);--dark:#1b1a18;--teal:#14a08a;--teal2:#0c7a6b;--grn:#2fa86b;--yel:#e0a53a;--red:#d9534f}

html{background:#d9cbb8}
body{margin:0;min-height:100vh;color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
 background:radial-gradient(40% 45% at 8% 20%,#a9794a 0,transparent 70%),radial-gradient(40% 40% at 92% 12%,#c79a6a 0,transparent 70%),radial-gradient(50% 45% at 55% 100%,#8f6a48 0,transparent 70%),radial-gradient(45% 40% at 50% 45%,#f4ebdd 0,transparent 80%),linear-gradient(160deg,#e3d6c4,#cdb89f);
 background-attachment:fixed;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.wrap{max-width:1240px;margin:0 auto}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:26px;backdrop-filter:blur(24px) saturate(1.25);-webkit-backdrop-filter:blur(24px) saturate(1.25);box-shadow:0 10px 34px rgba(70,45,20,.14)}

.topbar{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 8px;border-radius:99px;margin-bottom:14px}
.av{width:38px;height:38px;border-radius:50%;background:var(--dark);display:grid;place-items:center;font-size:1.1rem;flex:0 0 auto}
.topbar .t{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topbar .t small{color:var(--mut);font-weight:400;margin-left:8px}
.rb{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--glass2);display:grid;place-items:center;font-size:1rem;flex:0 0 auto;transition:.18s}.rb:hover{background:#fff;transform:rotate(25deg)}
.shell{display:grid;grid-template-columns:62px minmax(0,1fr);gap:14px;align-items:start}
.side{padding:10px;border-radius:99px;position:sticky;top:14px}
.nav{display:flex;flex-direction:column;gap:6px;align-items:center}
.nav button{position:relative;display:grid;place-items:center;width:42px;height:42px;background:none;border:0;border-radius:50%;color:var(--mut);transition:.18s}
.nav button:hover{background:rgba(255,255,255,.55);transform:scale(1.1)}
.nav button.on{background:var(--dark);box-shadow:0 6px 16px rgba(27,26,24,.3)}
.nav button{color:#3a342c}.nav button.on{color:#fff}.nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.nav button:hover{background:rgba(255,255,255,.75)}
.nav b{display:none;font-weight:500}
.nav sup{position:absolute;top:-2px;right:-2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:.64rem;line-height:17px;text-align:center;font-weight:700}
.main{padding:22px;min-height:calc(100vh - 100px)}
.hello{font-size:1.9rem;font-weight:700;margin:0;letter-spacing:-.01em}.sub{color:var(--mut);margin:2px 0 18px;font-size:.9rem}
.ov{display:grid;grid-template-columns:1.15fr 1fr 1.3fr;gap:12px}
.card{background:var(--glass2);border:1px solid var(--line);border-radius:22px;padding:16px 18px}
.card h3{margin:0 0 10px;font-size:.78rem;color:var(--mut);font-weight:600}
.big{font-size:2.2rem;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.ip{font-family:ui-monospace,Consolas,monospace;font-size:.78em;color:var(--tx)}.hint{color:var(--mut);font-size:.78rem}.pill{display:inline-block;font-size:.7rem;padding:2px 9px;border-radius:99px;background:rgba(47,168,107,.16);color:var(--grn);font-weight:600}
.btns{display:flex;gap:8px;margin:14px 0 12px}
.btn{flex:1;border:0;border-radius:99px;padding:11px 14px;font-weight:600;background:var(--dark);color:#fff}.btn.l{background:#fff;color:var(--tx)}
.mini{background:rgba(255,255,255,.55);border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.mini b{display:block;font-size:1.15rem}.mini span{font-size:.7rem;color:var(--mut)}
.col{display:grid;gap:12px;align-content:start}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .card{padding:14px 16px}.grid2 .big{font-size:1.9rem}
.teal{background:linear-gradient(145deg,var(--teal),var(--teal2));color:#fff;border-color:transparent;box-shadow:0 10px 24px rgba(12,122,107,.35)}.teal h3,.teal .hint{color:rgba(255,255,255,.8)}.teal .pill{background:rgba(255,255,255,.25);color:#fff}
.seg{display:inline-flex;background:rgba(255,255,255,.55);border-radius:99px;padding:3px;margin-bottom:12px;gap:2px}.seg button{border:0;background:none;border-radius:99px;padding:6px 12px;font-size:.78rem;color:var(--mut)}.seg button.on{background:var(--dark);color:#fff}

.chart div.td u{background:linear-gradient(180deg,#e9b44c,#b27d1b)}
.full{margin-top:12px}
.utool{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.utool input{flex:1;min-width:160px;font:inherit;border:1px solid var(--line);background:var(--glass2);border-radius:99px;padding:9px 16px;outline:0;color:var(--tx)}
.utab{background:var(--glass2);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.uh,.ur{display:grid;grid-template-columns:minmax(0,2.6fr) 1.2fr 1fr .6fr .9fr;gap:8px;padding:8px 14px;align-items:center;font-size:.82rem}
.uh{color:var(--mut);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;background:rgba(255,255,255,.5)}
.ur{border-top:1px solid rgba(255,255,255,.7);color:var(--mut)}.ur:hover{background:rgba(255,255,255,.6)}
.ur .n{display:flex;align-items:center;gap:8px;min-width:0;color:var(--tx)}.ur .n b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ur .n small{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ur .d{flex:0 0 8px;height:8px;border-radius:50%;background:var(--yel)}.ur .d.g{background:var(--grn)}
@media(max-width:720px){.uh span:nth-child(3),.ur span:nth-child(3){display:none}.uh,.ur{grid-template-columns:minmax(0,2fr) 1fr .6fr 1fr}}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px;background:var(--glass2);border:1px solid var(--line);border-radius:18px}
.row .d{flex:0 0 10px;height:10px;border-radius:50%;background:var(--yel)}.row .d.g{background:var(--grn)}.row .d.r{background:var(--red)}
.row .a{flex:1;min-width:0}.row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{text-align:right;white-space:nowrap;color:var(--mut);font-size:.78rem}
.bar{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:.86rem}.bar em{flex:0 0 36%;font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar s{flex:1;height:9px;background:rgba(255,255,255,.7);border-radius:6px;overflow:hidden}.bar s i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#e0a53a);border-radius:6px}.bar span{width:32px;text-align:right;color:var(--mut)}
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.ring{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}.ring div{width:84px;height:84px;border-radius:50%;background:#f6efe5;display:grid;place-items:center;text-align:center;font-size:.7rem;color:var(--mut);line-height:1.2}.ring b{display:block;color:var(--tx);font-size:1.15rem}
.leg{flex:1;min-width:140px;font-size:.84rem}.leg p{margin:6px 0;display:flex;align-items:center;gap:8px}.leg i{width:10px;height:10px;border-radius:50%;flex:0 0 auto}.leg span{margin-left:auto;color:var(--mut)}
.login{max-width:360px;margin:16vh auto;padding:30px 22px;text-align:center}.login input{width:100%;font:inherit;color:var(--tx);background:var(--glass2);border:1px solid var(--line);border-radius:99px;padding:13px 18px;margin:16px 0 10px;outline:0}.login .btn{width:100%}
.err{color:var(--red);font-size:.85rem;min-height:1.2em;margin-top:8px}.mut{color:var(--mut);font-size:.82rem}.empty{color:var(--mut);padding:8px 2px}
@media(max-width:980px){.ov{grid-template-columns:1fr 1fr}.ov>.chartc{grid-column:1/-1}}
@media(max-width:720px){
 .shell{grid-template-columns:1fr}.side{position:static;padding:6px;order:2;position:sticky;bottom:10px;top:auto;z-index:20;box-shadow:0 10px 34px rgba(70,45,20,.25)}
 .nav{flex-direction:row;justify-content:space-around}.nav button{width:auto;flex:1;border-radius:99px;grid-auto-flow:column;gap:6px;height:42px}.nav button.on b{display:inline;color:#fff;font-size:.8rem}
 .main{padding:16px;min-height:0}.hello{font-size:1.5rem}.ov{grid-template-columns:1fr}.topbar .t small{display:none}
}
/* 3D от мыши: слои плывут к краю, карточки наклоняются, колонки графика тянутся к курсору */
@media (hover:hover) and (pointer:fine){
 /* основа (.topbar, .side, .main) неподвижна — двигаются только карточки, строки и колонки */
 .card,.row,.utab,.ur{transition:transform .15s ease-out,box-shadow .2s ease-out;will-change:transform}
 .t3{position:relative}
 .t3::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .2s;background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.6),transparent 58%)}
 .t3.hot{box-shadow:0 26px 48px rgba(70,45,20,.32),0 4px 10px rgba(70,45,20,.18);z-index:3}
 .t3.hot::after{opacity:1}
 .chart{perspective:600px}
 .chart u{transform-origin:50% 100%;transition:transform .12s ease-out,filter .12s;will-change:transform}
}
</style></head><body>
<div id="app"></div>
<script>

function ago(t){if(!t)return"—";const s=(Date.now()-new Date(t))/1e3;if(s<60)return"только что";if(s<3600)return Math.floor(s/60)+" мин назад";if(s<86400)return Math.floor(s/3600)+" ч назад";return Math.floor(s/86400)+" дн назад"}
function login(msg=""){clearInterval(timer);app.innerHTML=`<div class="login glass"><h1 style="margin:0">🎬 Kinomatch</h1><div class="mut">Админка. Введите ключ доступа</div><input id="k" type="password" placeholder="Ключ" autocomplete="current-password"><button class="btn" id="go">Войти</button><div class="err">${esc(msg)}</div></div>`;
  const go=()=>{const v=$("#k").value.trim();if(!v)return;localStorage.kmAdm=v;load(true)};$("#go").onclick=go;$("#k").onkeydown=e=>e.key==="Enter"&&go()}
async function load(first){
  if(/^#k=/.test(location.hash)){localStorage.kmAdm=decodeURIComponent(location.hash.slice(3));history.replaceState(null,"",location.pathname)}
  const key=localStorage.kmAdm;if(!key)return login();
  try{const r=await fetch(URL_,{headers:{"x-admin-key":key}});
    if(r.status===401){delete localStorage.kmAdm;return login(first?"Неверный ключ":"")}
    const j=await r.json();if(j.error)throw new Error(j.error);D=j;draw();
    clearInterval(timer);timer=setInterval(()=>load(false),60000)}
  catch(e){if(D)return;app.innerHTML=`<div class="login glass"><div class="err">Не удалось загрузить: ${esc(e.message)}</div><button class="btn" id="rt">Повторить</button></div>`;$("#rt").onclick=()=>load(true)}}
let uq="",uf="all",un=30;
function flag(cc){try{return String.fromCodePoint(...[...cc.toUpperCase()].map(x=>127397+x.charCodeAt(0)))}catch(_){return""}}
function who(v){const n=v.uname||(v.uuser?"@"+v.uuser:"");if(v.email||n)return`<span style="color:var(--grn)">${esc(n)}${v.email?(n?" · ":"")+esc(v.email):""}</span>`;return v.guest?"гость":"аноним"}

   <div class="utool"><input id="uq" type="search" placeholder="Поиск: имя, @ник, почта, IP" value="${esc(uq)}"><div class="seg" style="margin:0">${chip("all","Все")}${chip("pair","В паре")}${chip("act","Активные")}${chip("idle","Без свайпов")}</div></div>
   <div class="utab"><div class="uh"><span>Имя / почта</span><span>IP</span><span>Рег.</span><span>Свайпов</span><span>Был</span></div>${L.slice(0,un).map(u=>`<div class="ur"><span class="n"><i class="d ${u.paired?"g":""}"></i><b>${esc(u.name||u.username||"без имени")}</b><small>${u.email?esc(u.email):(u.username?"@"+esc(u.username):"")}${u.prov?` · ${esc(u.prov==="email"?"почта":u.prov)}`:""}</small></span><span class="ip">${u.ip?esc(u.ip)+(u.cc?" "+esc(u.cc):""):"—"}</span><span>${ago(u.created_at)}</span><span>${u.swipes}</span><span>${u.last_swipe?ago(u.last_swipe):"—"}</span></div>`).join("")||'<div class="empty">Никого не нашлось</div>'}</div>
   ${L.length>un?`<button class="btn l" id="umore" style="width:100%;margin-top:10px">Показать ещё (${L.length-un})</button>`:""}`}
function draw(){
  const t=D.totals,S=D.series,mx=Math.max(1,...S.map(x=>x[tab]));
  const bars=(arr,k)=>{const m=Math.max(1,...arr.map(x=>x.n));return arr.map(x=>`<div class="bar"><em>${esc(x[k]||"прямой")}</em><s><i style="width:${x.n/m*100}%"></i></s><span>${x.n}</span></div>`).join("")||'<div class="empty">Пока пусто</div>'};
  const COL=["#14a08a","#e0a53a","#1b1a18","#c9744a","#8a7ee0","#9aa5ad"];
  const donut=arr=>{const tot=arr.reduce((a,x)=>a+x.n,0);if(!tot)return'<div class="empty">Пока пусто</div>';let acc=0;const seg=arr.slice(0,6).map((x,i)=>{const a=acc/tot*360;acc+=x.n;return`${COL[i]} ${a}deg ${acc/tot*360}deg`});if(acc<tot)seg.push(`#d6cbbd ${acc/tot*360}deg 360deg`);
    return`<div class="donut"><div class="ring" style="background:conic-gradient(${seg.join(",")})"><div><span><b>${tot}</b>за 7 дн</span></div></div><div class="leg">${arr.slice(0,6).map((x,i)=>`<p><i style="background:${COL[i]}"></i>${esc(x.dev||"?")}<span>${Math.round(x.n/tot*100)}%</span></p>`).join("")}</div></div>`};
  const IC={over:'<rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="4" width="4" height="17" rx="1"/><rect x="17" y="9" width="4" height="12" rx="1"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.6"/><path d="M17 14.2c2.7.2 4.5 2.1 4.5 5"/>',src:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',vis:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',err:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>'};
  const NAV=[["over","Обзор"],["users","Люди"],["src","Источники"],["vis","Визиты"],["err","Ошибки"]].map(a=>[...a,`<svg viewBox="0 0 24 24">${IC[a[0]]}</svg>`]);
  const h=new Date().getHours(),greet=h<5?"Доброй ночи":h<12?"Доброе утро":h<18?"Добрый день":"Добрый вечер";
  const dt=new Date().toLocaleDateString("ru",{weekday:"long",day:"numeric",month:"long"});
  const visRow=v=>`<div class="row"><i class="d ${v.guest?"":"g"}"></i><div class="a"><b>${esc(v.ev)} · ${who(v)}</b><small>${v.ip?`<span class="ip">${esc(v.ip)}</span>${v.cc?" "+esc(flag(v.cc)+" "+v.cc):""} · `:""}${esc(v.dev||"?")} · ${esc(v.lang||"")} · ${esc(v.ref||"прямой")} · #${esc(v.sid)}</small></div><div class="r">${ago(v.at)}</div></div>`;
  const S_={
   over:`<h1 class="hello">${greet}!</h1><p class="sub">${dt} · так идут дела у Kinomatch</p>
    <div class="ov">
     <div class="col"><div class="card"><h3>Визитов за 24 часа</h3><div class="big">${t.visits_24h}</div><span class="hint">за 7 дней: ${t.visits_7d} · гостей: ${t.guests_7d}</span>
       <div class="btns"><button class="btn" id="rf">⟳ Обновить</button><button class="btn l" id="open">Открыть сайт</button></div>
       <div class="mini"><div><b>${t.swipers_7d}</b><span>свайпали (7 дн)</span></div><div><b>${t.swipers}</b><span>всего людей</span></div><div><b>${t.swipes}</b><span>всего свайпов</span></div></div></div></div>
     <div class="grid2" style="align-content:start">
       <div class="card teal"><h3>Регистраций</h3><div class="big">${t.regs}</div><span class="pill">+${t.regs_24h} сутки</span> <span class="hint">+${t.regs_7d} нед.</span></div>
       <div class="card"><h3>Свайпов за 24 ч</h3><div class="big">${t.swipes_24h}</div><span class="hint">всего ${t.swipes}</span></div>
       <div class="card"><h3>Пар создано</h3><div class="big">${t.paired}</div><span class="hint">вдвоём смотрят</span></div>
       <div class="card"><h3>Ошибок за 24 ч</h3><div class="big" style="color:${t.errors_24h?"var(--red)":"var(--grn)"}">${t.errors_24h}</div><span class="hint">${t.errors_24h?"смотри раздел ⚠️":"всё чисто"}</span></div></div>
     <div class="card chartc"><h3>Последние 14 дней</h3><div class="seg">${[["visits","Визиты"],["regs","Регистрации"],["swipes","Свайпы"]].map(([k,n])=>`<button data-t="${k}" class="${tab===k?"on":""}">${n}</button>`).join("")}</div>
       <div class="chart">${S.map(x=>`<div class="${tab==="swipes"?"td":""}"><span>${x[tab]||""}</span><u style="height:${x[tab]/mx*84}%"></u><span>${x.day.slice(8)}</span></div>`).join("")}</div></div>
    </div>
    <div class="card full"><h3>Недавняя активность</h3>${D.visits.slice(0,6).map(visRow).join("")||'<div class="empty">Нет</div>'}</div>`,
   users:usersView(),
   src:`<h1 class="hello">Источники</h1><p class="sub">За последние 7 дней</p><div class="card"><h3>Откуда приходят</h3>${bars(D.refs,"ref")}</div><div class="card full"><h3>Устройства</h3>${donut(D.devs)}</div><div class="card full"><h3>События</h3>${bars(D.evs.map(e=>({ref:e.ev,n:e.n})),"ref")}</div>`,
   vis:`<h1 class="hello">Визиты</h1><p class="sub">Последние заходы на сайт</p>`+(D.visits.map(visRow).join("")||'<div class="empty">Нет</div>'),
   err:`<h1 class="hello">Ошибки</h1><p class="sub">Что ломалось на сайте</p>`+(D.errors.map(e=>`<div class="row"><i class="d r"></i><div class="a"><b>${esc(e.msg)}</b><small>${esc(e.path)}</small></div><div class="r">${ago(e.at)}</div></div>`).join("")||'<div class="empty">Ошибок нет 🎉</div>')};
  app.innerHTML=`<div class="wrap"><div class="glass topbar"><div class="av">🎬</div><div class="t">Kinomatch · админка<small>обновлено ${ago(D.now)} · авто раз в минуту</small></div><button class="rb" id="rf2" title="Обновить">⟳</button><button class="rb" id="lo" title="Выйти">⎋</button></div>
  <div class="shell"><aside class="side glass"><div class="nav">${NAV.map(([k,n,i])=>`<button data-s="${k}" data-l="${n}" title="${n}" class="${sec===k?"on":""}"><em>${i}</em><b>${n}</b>${k==="err"&&D.errors.length?`<sup>${D.errors.length}</sup>`:""}</button>`).join("")}</div></aside>
  <main class="main glass">${S_[sec]}</main></div></div>`;
  const rf=()=>load(false);$("#rf2").onclick=rf;if($("#rf"))$("#rf").onclick=rf;if($("#open"))$("#open").onclick=()=>window.open("/","_blank");
  $("#lo").onclick=()=>{delete localStorage.kmAdm;D=null;login()};
  if($("#uq")){const i=$("#uq");i.oninput=()=>{uq=i.value;un=30;const c=i.selectionStart;draw();const j=$("#uq");j.focus();j.setSelectionRange(c,c)}}
  document.querySelectorAll("[data-uf]").forEach(b=>b.onclick=()=>{uf=b.dataset.uf;un=30;draw()});if($("#umore"))$("#umore").onclick=()=>{un+=50;draw()};
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sec=b.dataset.s;draw();scrollTo(0,0)})}
load(true);
/* ===== 3D-эффект мыши (только мышь, без reduce-motion) ===== */
(()=>{
 if(!matchMedia("(hover:hover) and (pointer:fine)").matches)return; /* reduced-motion сознательно игнорируем: эффект заказан владельцем */
 const root=document.documentElement;let px=0,py=0,raf=0,last=null,chartEv=null;
 const ease=v=>.35*v+.65*v*v*v; // у краёв экрана сильнее
 const frame=()=>{raf=0;
  root.style.setProperty("--mx",ease(px).toFixed(3));root.style.setProperty("--my",ease(py).toFixed(3));
  const e=chartEv;if(e){const ch=e.target.closest&&e.target.closest(".chart");if(ch){
    for(const d of ch.children){const u=d.querySelector("u");if(!u)continue;const r=d.getBoundingClientRect(),dx=Math.abs(e.clientX-(r.left+r.width/2))/Math.max(r.width,1);
     const k=Math.max(0,1-dx/2.6);u.style.transform=`translateY(${(-k*10).toFixed(1)}px) scaleY(${(1+k*.16).toFixed(3)}) scaleX(${(1+k*.25).toFixed(3)}) rotateX(${(-k*14).toFixed(1)}deg)`;u.style.filter=`brightness(${(1+k*.25).toFixed(2)}) drop-shadow(0 ${(k*10).toFixed(0)}px ${(k*8).toFixed(0)}px rgba(15,95,85,.35))`}}}
 };
 const sched=()=>{if(!raf)raf=requestAnimationFrame(frame)};
 addEventListener("mousemove",e=>{px=(e.clientX/innerWidth)*2-1;py=(e.clientY/innerHeight)*2-1;chartEv=e;sched();
  let c=e.target.closest&&!e.target.closest(".chart")&&e.target.closest(".card");
  /* только небольшие карточки; большие списки (активность, люди) и строки без кнопок не трогаем */
  if(c){const b=c.getBoundingClientRect();if(b.width>460||b.height>300||c.matches(".full,.chartc"))c=null}
  if(last&&last!==c){last.style.transform="";last.classList.remove("hot","t3")}
  if(c){const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
   c.classList.add("t3","hot");c.style.setProperty("--gx",((x+.5)*100).toFixed(0)+"%");c.style.setProperty("--gy",((y+.5)*100).toFixed(0)+"%");
   c.style.transform=`perspective(700px) rotateX(${(-y*14).toFixed(2)}deg) rotateY(${(x*18).toFixed(2)}deg) translate3d(${(x*8).toFixed(1)}px,${(y*8).toFixed(1)}px,0) scale(1.035)`;}
  last=c||null;
 },{passive:true});
 document.addEventListener("mouseleave",()=>{px=py=0;chartEv=null;if(last){last.style.transform="";last.classList.remove("hot","t3");last=null}
  document.querySelectorAll(".chart u").forEach(u=>{u.style.transform="";u.style.filter=""});sched()});
 addEventListener("mouseout",e=>{if(e.relatedTarget)return;px=py=0;sched()});
 document.addEventListener("mouseover",e=>{const ch=document.querySelectorAll(".chart");if(!e.target.closest(".chart"))ch.forEach(c=>c.querySelectorAll("u").forEach(u=>{u.style.transform="";u.style.filter=""}))},{passive:true});
})();
</script></body></html>
