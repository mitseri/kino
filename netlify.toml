[build]
  publish = "."
  command = "curl -sSfL https://codeload.github.com/mitseri/kino/tar.gz/refs/heads/seo | tar xz --strip-components=1 && test -f sitemap.xml && npx -y esbuild@0.24.0 app.js --minify --charset=utf8 --target=es2020 --allow-overwrite --outfile=app.js && npx -y esbuild@0.24.0 app.css --minify --charset=utf8 --allow-overwrite --outfile=app.css && npx -y esbuild@0.24.0 i18n.js --minify --charset=utf8 --allow-overwrite --outfile=i18n.js"
  ignore = "bash tools/netlify-ignore.sh"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
