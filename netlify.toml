[build]
  publish = "."
  command = "npx -y esbuild@0.24.0 app.js --minify --charset=utf8 --target=es2020 --allow-overwrite --outfile=app.js && npx -y esbuild@0.24.0 app.css --minify --charset=utf8 --allow-overwrite --outfile=app.css && npx -y esbuild@0.24.0 i18n.js --minify --charset=utf8 --allow-overwrite --outfile=i18n.js"
  ignore = "bash tools/netlify-ignore.sh"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
