name: SEO pages (podborki, films, actors, similar)
on:
  schedule:
    - cron: "17 3 * * *"   # every day 03:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-seo.mjs
      # Thousands of generated pages live on a one-commit "seo" branch (force-pushed weekly) so main stays small.
      - name: Publish to seo branch
        run: |
          mkdir -p /tmp/out && cp -r film uk en podborki aktery pohozhie sitemap.xml /tmp/out/
          cd /tmp/out
          git init -q -b seo
          git add -A
          git -c user.name=kinomatch-bot -c user.email=kinomatch-bot@users.noreply.github.com commit -qm "SEO pages $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" seo
      - name: Trigger site deploy
        run: |
          rm -rf film uk en podborki aktery pohozhie sitemap.xml
          date -u +%FT%TZ > seo-version.txt
          git config user.name "kinomatch-bot"
          git config user.email "kinomatch-bot@users.noreply.github.com"
          git add seo-version.txt
          git commit -m "seo: pages refreshed"
          git push
