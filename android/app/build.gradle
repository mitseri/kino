// Kinomatch Android app: a Trusted Web Activity around https://kinomatch-ua.netlify.app/
// Falls back to a WebView on phones without Chrome (e.g. Huawei without Google services).
plugins { id "com.android.application" }
android {
  namespace "ua.kinomatch.app"
  compileSdk 34
  defaultConfig {
    applicationId "ua.kinomatch.app"
    minSdk 21
    targetSdk 34
    versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
    versionName System.getenv("VERSION_NAME") ?: "1.0"
    manifestPlaceholders = [host: "kinomatch-ua.netlify.app", url: "https://kinomatch-ua.netlify.app/?src=android"]
  }
  signingConfigs { release { storeFile file(System.getenv("KS_FILE") ?: "none.jks"); storePassword System.getenv("KS_PASS"); keyAlias "kinomatch"; keyPassword System.getenv("KS_PASS") } }
  buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0" }
